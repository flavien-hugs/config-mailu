# ---------------------------------------------
# À lancer avec le fichier d'environnement :
#
#   docker compose --env-file mailu.env up -d
#
# mailu.env ne contient que des valeurs : --env-file les substitue aux
# ${...} de ce fichier. C'est ici que chaque service reçoit ses variables,
# et seulement celles qui le concernent.
# ---------------------------------------------

# ---------------------------------------------
# Fragments partagés, fusionnés dans les services avec `<<:`
# (docker compose ignore lui-même les clés x-).
# ---------------------------------------------

x-restart: &restart
  restart: always

# Configuration commune à tous les services Mailu. Les variables propres
# à un service (base de données, compte admin initial, proxy) sont
# déclarées dans ce service seulement, via `<<: *mailu-env` + ses ajouts.
#
# `VAR:` sans valeur = reprise telle quelle de mailu.env ; absente de
# mailu.env, elle n'est pas définie dans le conteneur et Mailu applique
# sa valeur par défaut. `${VAR:?...}` = obligatoire.
x-mailu-env: &mailu-env
  SECRET_KEY: ${SECRET_KEY:?à définir dans mailu.env}
  SUBNET:
  DOMAIN: ${DOMAIN:?à définir dans mailu.env}
  HOSTNAMES: ${HOSTNAMES:?à définir dans mailu.env}
  POSTMASTER:
  TLS_FLAVOR:
  DISABLE_STATISTICS:
  ADMIN:
  WEBMAIL:
  API:
  WEBDAV:
  ANTIVIRUS:
  SCAN_MACROS:
  MESSAGE_SIZE_LIMIT:
  MESSAGE_RATELIMIT:
  RELAYNETS:
  RELAYHOST:
  FETCHMAIL_ENABLED:
  RECIPIENT_DELIMITER:
  DMARC_RUA:
  DMARC_RUF:
  DMARC_SEND_REPORTS:
  WELCOME:
  WELCOME_SUBJECT:
  WELCOME_BODY:
  COMPRESSION:
  COMPRESSION_LEVEL:
  FULL_TEXT_SEARCH:
  FULL_TEXT_SEARCH_ATTACHMENTS:
  WEBROOT_REDIRECT:
  WEB_ADMIN:
  WEB_WEBMAIL:
  WEB_API:
  SITENAME:
  WEBSITE:
  CREDENTIAL_ROUNDS:
  REAL_IP_HEADER:
  REAL_IP_FROM:
  REJECT_UNLISTED_RECIPIENT:
  LOG_LEVEL:
  TZ:
  DEFAULT_SPAM_THRESHOLD:
  API_TOKEN:
  SESSION_COOKIE_SECURE:
  PORTS:
  ANTIVIRUS_ACTION:
  AUTH_RATELIMIT_IP:
  AUTH_RATELIMIT_USER:
  AUTH_REQUIRE_TOKENS:
  DEFAULT_QUOTA:
  LETSENCRYPT_SHORTCHAIN:
  OUTBOUND_TLS_LEVEL:
  PERMANENT_SESSION_LIFETIME:
  SESSION_TIMEOUT:
  TLS_PERMISSIVE:

# Accès PostgreSQL de Mailu (admin), repris par database pour l'init.
x-db-env: &db-env
  DB_FLAVOR: postgresql
  DB_HOST: database
  DB_NAME:
  DB_USER:
  DB_PW: ${DB_PW:?à définir dans mailu.env}

# Accès PostgreSQL de Roundcube (webmail), repris par database pour l'init.
x-roundcube-db-env: &roundcube-db-env
  ROUNDCUBE_DB_FLAVOR: postgresql
  ROUNDCUBE_DB_HOST: database
  ROUNDCUBE_DB_NAME:
  ROUNDCUBE_DB_USER:
  ROUNDCUBE_DB_PW: ${ROUNDCUBE_DB_PW:?à définir dans mailu.env}

# Résolveur DNS interne (unbound), à IP fixe sur le réseau default.
x-dns: &dns
  dns:
    - 192.168.203.254


services:

  # ---------------------------------------------
  # Redis
  # ---------------------------------------------

  redis:
    <<: [*restart, *dns]
    # Version exacte : une mise à jour doit être un choix, pas un pull.
    image: redis:8.10.2-alpine

    volumes:
      - ./redis:/data

    depends_on:
      - resolver

    networks:
      - default


  # ---------------------------------------------
  # Résolveur DNS
  # ---------------------------------------------

  resolver:
    <<: *restart
    image: ghcr.io/mailu/unbound:${MAILU_VERSION:?lancer avec --env-file mailu.env}

    environment: *mailu-env

    networks:
      default:
        ipv4_address: 192.168.203.254


  # ---------------------------------------------
  # Frontal Mailu
  # HTTP / HTTPS / SMTP / IMAP / POP3
  # ---------------------------------------------

  front:
    <<: [*restart, *dns]
    image: ghcr.io/mailu/nginx:${MAILU_VERSION:?lancer avec --env-file mailu.env}

    environment:
      <<: *mailu-env
      # Lus par nginx-proxy / acme-companion, posés sur front seulement.
      VIRTUAL_HOST:
      VIRTUAL_PORT:
      LETSENCRYPT_HOST:
      # Certificat du TLS mail, relatif à /certs.
      TLS_CERT_FILENAME:
      TLS_KEYPAIR_FILENAME:

    ports:
      # Sur le serveur, 80 / 443 appartiennent à nginx-proxy : lier ailleurs
      # via FRONT_HTTP_PORT / FRONT_HTTPS_PORT (ex. 127.0.0.1:8080).
      - "${FRONT_HTTP_PORT:-80}:80"
      - "${FRONT_HTTPS_PORT:-443}:443"

      # Ports mail : chaque variable vaut « [ip:]port hôte ». Sur le serveur,
      # préfixer par 127.0.0.1: les ports à ne pas exposer (110, 143, 4190) ;
      # docker publie en contournant ufw, c'est donc ici qu'on ferme.
      - "${SMTP_PORT:-25}:25"
      - "${SUBMISSIONS_PORT:-465}:465"
      - "${SUBMISSION_PORT:-587}:587"

      - "${POP3_PORT:-110}:110"
      - "${POP3S_PORT:-995}:995"

      - "${IMAP_PORT:-143}:143"
      - "${IMAPS_PORT:-993}:993"

      - "${SIEVE_PORT:-4190}:4190"

    volumes:
      # Sur le serveur : répertoire des certificats d'acme-companion.
      - ${FRONT_CERTS_DIR:-./certs}:/certs
      - ./overrides/nginx:/overrides:ro

    networks:
      - default
      - webmail
      - radicale
      - proxy

    depends_on:
      - resolver


  # ---------------------------------------------
  # PostgreSQL
  # Héberge les bases de Mailu (admin) et de Roundcube (webmail).
  # Rôles et bases créés par postgres/initdb au premier démarrage.
  # ---------------------------------------------

  database:
    <<: *restart
    # Version exacte ; changer de majeure (16 -> 17) demande un dump/restore.
    image: postgres:16.14-alpine

    # Pas de config Mailu : seulement le superutilisateur et les accès
    # lus par postgres/initdb/01-mailu.sh.
    environment:
      <<: [*db-env, *roundcube-db-env]
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans mailu.env}

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro

    networks:
      - database

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10


  # ---------------------------------------------
  # Admin
  # ---------------------------------------------

  admin:
    <<: [*restart, *dns]
    image: ghcr.io/mailu/admin:${MAILU_VERSION:?lancer avec --env-file mailu.env}

    environment:
      <<: [*mailu-env, *db-env]
      INITIAL_ADMIN_ACCOUNT:
      INITIAL_ADMIN_DOMAIN:
      INITIAL_ADMIN_PW: ${INITIAL_ADMIN_PW:?à définir dans mailu.env}
      INITIAL_ADMIN_MODE:

    volumes:
      - ./data:/data
      - ./dkim:/dkim

    networks:
      - default
      - database

    depends_on:
      redis:
        condition: service_started
      resolver:
        condition: service_started
      database:
        condition: service_healthy


  # ---------------------------------------------
  # IMAP / Dovecot
  # ---------------------------------------------

  imap:
    <<: [*restart, *dns]
    image: ghcr.io/mailu/dovecot:${MAILU_VERSION:?lancer avec --env-file mailu.env}

    environment: *mailu-env

    volumes:
      - ./mail:/mail
      - ./overrides/dovecot:/overrides:ro

    networks:
      - default

    depends_on:
      - front
      - resolver


  # ---------------------------------------------
  # SMTP / Postfix
  # ---------------------------------------------

  smtp:
    <<: [*restart, *dns]
    image: ghcr.io/mailu/postfix:${MAILU_VERSION:?lancer avec --env-file mailu.env}

    environment: *mailu-env

    volumes:
      - mailqueue:/queue
      - ./overrides/postfix:/overrides:ro

    networks:
      - default

    depends_on:
      - front
      - resolver


  # ---------------------------------------------
  # Oletools
  # ---------------------------------------------

  oletools:
    <<: [*restart, *dns]
    image: ghcr.io/mailu/oletools:${MAILU_VERSION:?lancer avec --env-file mailu.env}
    hostname: oletools

    networks:
      - oletools

    depends_on:
      - resolver


  # ---------------------------------------------
  # Rspamd
  # ---------------------------------------------

  antispam:
    <<: [*restart, *dns]
    image: ghcr.io/mailu/rspamd:${MAILU_VERSION:?lancer avec --env-file mailu.env}

    environment: *mailu-env
    hostname: antispam

    volumes:
      - ./filter:/var/lib/rspamd
      - ./overrides/rspamd:/overrides:ro

    networks:
      - default
      - oletools
      - clamav

    depends_on:
      - front
      - redis
      - oletools
      - antivirus
      - resolver


  # ---------------------------------------------
  # ClamAV
  # ---------------------------------------------

  antivirus:
    <<: *restart
    image: clamav/clamav-debian:1.4

    volumes:
      - ./clamav:/var/lib/clamav

    networks:
      - clamav

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kill -0 `cat /tmp/clamd.pid` && kill -0 `cat /tmp/freshclam.pid`"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s


  # ---------------------------------------------
  # WebDAV / CardDAV / CalDAV
  # ---------------------------------------------

  webdav:
    <<: *restart
    image: ghcr.io/mailu/radicale:${MAILU_VERSION:?lancer avec --env-file mailu.env}

    volumes:
      - ./dav:/data

    networks:
      - radicale


  # ---------------------------------------------
  # Fetchmail
  # ---------------------------------------------

  fetchmail:
    <<: [*restart, *dns]
    image: ghcr.io/mailu/fetchmail:${MAILU_VERSION:?lancer avec --env-file mailu.env}

    environment:
      <<: *mailu-env
      FETCHMAIL_DELAY:

    volumes:
      - ./data/fetchmail:/data

    networks:
      - default

    depends_on:
      - admin
      - smtp
      - imap
      - resolver


  # ---------------------------------------------
  # Roundcube
  # L'image s'appelle « webmail » depuis Mailu 2024.06
  # (ghcr.io/mailu/roundcube n'existe que jusqu'à la 1.9).
  # ---------------------------------------------

  webmail:
    <<: *restart
    image: ghcr.io/mailu/webmail:${MAILU_VERSION:?lancer avec --env-file mailu.env}

    environment:
      <<: [*mailu-env, *roundcube-db-env]
      ROUNDCUBE_PLUGINS:

    volumes:
      - ./webmail:/data
      - ./overrides/roundcube:/overrides:ro

    networks:
      - webmail
      - database

    depends_on:
      front:
        condition: service_started
      database:
        condition: service_healthy


# ---------------------------------------------
# Réseaux
# ---------------------------------------------

networks:

  default:
    driver: bridge

    ipam:
      config:
        - subnet: 192.168.203.0/24

  webmail:
    driver: bridge

  oletools:
    driver: bridge

  clamav:
    driver: bridge

  radicale:
    driver: bridge

  database:
    driver: bridge

  # Réseau de nginx-proxy, créé en dehors de cette stack. En local :
  #   docker network create nginx-proxy
  proxy:
    name: ${PROXY_NETWORK:-nginx-proxy}
    external: true

volumes:
  # Volume nommé : postfix doit attribuer sa file d'attente à
  # postfix:postdrop (chown), ce qu'un bind mount macOS refuse.
  mailqueue:
  # Volume nommé : postgres refuse un répertoire de données qu'il ne peut pas chown.
  pgdata:
