# Page de connexion à l'adresse /auth/login (Mailu : /sso/login, codé en dur).
#
# - /auth/login : relayé vers /sso/login du service admin, logique de Mailu
#   inchangée (SSO, limitation des tentatives, redirections).
# - /sso/login : redirigé vers /auth/login, paramètres compris. Couvre les
#   redirections automatiques de Mailu (webmail ou admin sans session,
#   déconnexion), qui visent toujours /sso/login.
# Les autres adresses /sso/* (changement de mot de passe, déconnexion…) ne
# changent pas.
#
# Emplacements exacts (=) : prioritaires sur « location ~ ^/(sso|static)/ »
# de Mailu. Inclus par front dans le bloc server web.

location = /auth/login {
  include /etc/nginx/proxy.conf;
  rewrite ^ /sso/login break;
  # Cookie « appareil de confiance » de Mailu, limité à /sso/login : le
  # rattacher à /auth/login pour que le navigateur le renvoie ici.
  proxy_cookie_path /sso/login /auth/login;
  proxy_pass http://$admin;
}

location = /sso/login {
  return 302 /auth/login$is_args$args;
}
