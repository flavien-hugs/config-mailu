# Masque le pied de page de l'admin et de la page de connexion Mailu
# (« Built with ♥ using Flask and AdminLTE », lien GitHub, version de Mailu).
# Inclus par front dans le bloc server web : nginx injecte une règle CSS avant
# </head> des pages HTML qu'il relaie. Aucun template Mailu n'est modifié,
# donc rien à reporter lors d'une mise à jour. Sans effet sur Roundcube, qui
# n'a pas d'élément .main-footer.
sub_filter '</head>' '<style>.main-footer{display:none!important}</style></head>';
sub_filter_once on;
