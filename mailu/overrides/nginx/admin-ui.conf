# Retouches de l'interface Mailu (admin et connexion), sans modifier ses
# templates : front injecte une règle CSS avant </head> des pages HTML qu'il
# relaie. Rien à reporter lors d'une mise à jour de Mailu. Sans effet sur
# Roundcube, qui n'a aucun de ces éléments.
#
# - .main-footer : « Built with ♥ using Flask and AdminLTE », GitHub, version
# - menu latéral : liens Configuration client, Site web et Aide (mailu.io)
#
# Liens repérés par leur icône (fa-laptop, fa-globe) ou leur URL fixe, pas
# par un chemin dépendant de WEB_ADMIN. Aucun caractère dollar dans la
# règle : nginx le lit comme une variable (donc pas de sélecteur $=).
#
# La page de connexion elle-même est remplacée (overrides/admin/login.html).
sub_filter '</head>' '<style>.main-footer,.nav-sidebar li:has(>a>.fa-laptop),.nav-sidebar li:has(>a[href="https://mailu.io"]),.nav-sidebar li:has(>a>.fa-globe){display:none!important}</style></head>';
sub_filter_once on;
